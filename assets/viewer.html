<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golf Range Simulator — Asset Workbench</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14231e;color:#e9eddf;font:14px system-ui,sans-serif;display:grid;grid-template-columns:290px 1fr;height:100vh}aside{padding:28px 20px;overflow:auto;border-right:1px solid #34453a}small{color:#d2a56b;letter-spacing:.15em;font-size:10px}h1{font-size:25px;line-height:1.15;margin:12px 0 8px}p{line-height:1.6;color:#a9b7a9;font-size:12px}nav{display:grid;gap:5px;margin-top:25px}button{font:inherit;text-align:left;background:transparent;border:1px solid #34453a;border-radius:7px;color:#cad6c8;padding:10px 12px;cursor:pointer}button:hover{background:#23382a}button.active{color:#fff0d8;background:#5c3c20;border-color:#c8873f}.viewport{position:relative;min-width:0}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}.toolbar{position:absolute;top:22px;left:24px;display:flex;gap:8px}.toolbar button{background:#14231ee8}.info{position:absolute;bottom:25px;left:28px;right:28px;display:flex;justify-content:space-between;gap:20px;pointer-events:none}.info strong{font-size:20px}.info p{margin-bottom:0;max-width:500px}#stats{font:12px monospace;color:#d9dfce;white-space:pre-line;text-align:right}#status{margin-top:14px} @media(max-width:700px){body{grid-template-columns:190px 1fr}aside{padding:18px 12px}h1{font-size:20px}.info{left:15px}.info p,#stats{display:none}}
</style>
<aside><small>BLENDER → BROWSER</small><h1>Golf Range<br>Simulator</h1><p>Original 3D assets.<br>Drag to orbit · scroll to zoom.</p><nav aria-label="Models" id="models"></nav><p id="status" role="status">Loading rendering engine…</p></aside>
<main class="viewport"><canvas id="canvas" aria-label="Interactive 3D model preview"></canvas><div class="toolbar"><button id="animate">Pause animation</button><button id="wire">Wireframe</button><button id="reset">Reset camera</button></div><div class="info"><div><strong id="name">Asset preview</strong><p id="description"></p></div><div id="stats"></div></div></main>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
(async()=>{
const status=document.querySelector('#status');
try {
const manifest=await (await fetch('manifest.json')).json();
const canvas=document.querySelector('#canvas');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
const scene=new BABYLON.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new BABYLON.Color4(.105,.15,.12,1);
const camera=new BABYLON.ArcRotateCamera('Camera',Math.PI/3,Math.PI/3,6,new BABYLON.Vector3(0,1,0),scene);camera.attachControl(canvas,true);camera.wheelDeltaPercentage=.012;camera.panningSensibility=150;
new BABYLON.HemisphericLight('Sky',new BABYLON.Vector3(0,1,0),scene).intensity=.85;
const sun=new BABYLON.DirectionalLight('Sun',new BABYLON.Vector3(-.5,-1,.4),scene);sun.intensity=2;sun.position=new BABYLON.Vector3(10,20,-10);
const shadows=new BABYLON.ShadowGenerator(2048,sun);shadows.useBlurExponentialShadowMap=true;shadows.blurKernel=24;shadows.darkness=.3;
const ground=BABYLON.MeshBuilder.CreateGround('StudioFloor',{width:180,height:180},scene);ground.position.y=-.012;ground.receiveShadows=true;
const floor=new BABYLON.StandardMaterial('StudioFloorMaterial',scene);floor.diffuseColor=new BABYLON.Color3(.22,.30,.23);floor.specularColor=BABYLON.Color3.Black();ground.material=floor;
let container=null,current=null,playing=true,wire=false,busy=false;
function frame(){if(!container)return;const meshes=container.meshes.filter(m=>m.getTotalVertices()>0);const min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);for(const m of meshes){m.computeWorldMatrix(true);const b=m.getBoundingInfo().boundingBox;min.minimizeInPlace(b.minimumWorld);max.maximizeInPlace(b.maximumWorld);}const diag=max.subtract(min).length();camera.target=min.add(max).scale(.5);camera.radius=Math.max(diag*1.4,.065);camera.minZ=Math.max(diag/1000,.0001);camera.maxZ=Math.max(diag*100,200);camera.lowerRadiusLimit=diag*.2;camera.upperRadiusLimit=diag*5;camera.alpha=Math.PI/3;camera.beta=Math.PI/3;shadows.getShadowMap().renderList=meshes;ground.setEnabled(current.id!=='range-ground');}
async function load(id){
 if(busy)throw new Error('An asset is already loading');busy=true;status.textContent='Loading '+id+'…';
 try{
 if(container){container.removeAllFromScene();container.dispose();}
 current=manifest.assets.find(a=>a.id===id);
 container=await BABYLON.SceneLoader.LoadAssetContainerAsync('./models/',id+'.glb',scene);
 container.addAllToScene();
 for(const group of container.animationGroups){group.start(true);if(!playing)group.pause();}
 for(const mat of container.materials)mat.wireframe=wire;
 frame();
 document.querySelector('#name').textContent=id.replaceAll('-',' ');
 document.querySelector('#description').textContent=current.description;
 document.querySelector('#stats').textContent=current.triangles_exported.toLocaleString()+' triangles\n'+Math.ceil(current.bytes/1024)+' KB GLB\n'+container.animationGroups.length+' animation clips';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 status.textContent='Loaded · '+engine.getClassName();
 window.currentAsset={id,meshCount:container.meshes.filter(m=>m.getTotalVertices()>0).length,animationGroups:container.animationGroups.map(g=>({name:g.name,targets:g.targetedAnimations.length})),vertices:container.meshes.reduce((s,m)=>s+m.getTotalVertices(),0)};
 await scene.whenReadyAsync();
 return window.currentAsset;
 }finally{busy=false;}
}
for(const a of manifest.assets){const b=document.createElement('button');b.textContent=a.id.replaceAll('-',' ');b.dataset.id=a.id;b.onclick=()=>load(a.id).catch(e=>status.textContent=e.message);document.querySelector('#models').append(b);}
document.querySelector('#animate').onclick=()=>{playing=!playing;for(const g of container.animationGroups)playing?g.play(true):g.pause();document.querySelector('#animate').textContent=playing?'Pause animation':'Play animation';};
document.querySelector('#wire').onclick=()=>{wire=!wire;for(const m of container.materials)m.wireframe=wire;document.querySelector('#wire').classList.toggle('active',wire);};
document.querySelector('#reset').onclick=frame;
engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
window.assetWorkbench={load,manifest,scene,engine,get container(){return container;},async checkAll(){const r=[];for(const a of manifest.assets)r.push(await load(a.id));await load('tractor-picker');return r;}};
await load('tractor-picker');
}catch(e){status.textContent='Preview error: '+e.message;console.error(e);}
})();
</script>
</html>
